<script>
  function safeMount(fn, sel){ try{ if(typeof window[fn]==='function') window[fn](sel); }catch(e){ console.warn(fn, e); } }
  safeMount('mountDice','#dado');
  safeMount('addDiceSound','#dado');
  safeMount('mountBoard','#tabuleiro-painel');
  safeMount('mountSolution','#solucao-painel');
  safeMount('mountAdmin','#admin-painel');
  safeMount('mountVoice','#voz-painel');
  safeMount('mountBot','#bot-painel'); // NOVO
  safeMount('mountPanelNav','#panel-tabbar'); // ATUALIZADO: era mountMobileNav
</script>
